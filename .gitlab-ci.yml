# .gitlab-ci.yml
image: python:3.12

stages:
  - test
  - report
  - pages

variables:
  HEADLESS: "true"
  PYTHONUNBUFFERED: "1"

before_script:
  - pip install -r requirements.txt
  - apt-get update && apt-get install -y wget unzip chromium chromium-driver
  - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.zip
  - unzip allure-2.32.0.zip -d /opt/
  - export PATH=$PATH:/opt/allure-2.32.0/bin

# Запуск тестов
test:
  stage: test
  script:
    - pytest tests/test_release_types.py -v --headless --alluredir=allure-results --capture=no
  artifacts:
    paths:
      - allure-results/
    expire_in: 7 days
  only:
    - main
    - merge_requests

# Генерация Allure отчета
report:
  stage: report
  script:
    - /opt/allure-2.32.0/bin/allure generate allure-results -o allure-report --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 30 days
  only:
    - main
    - merge_requests

# Публикация в GitLab Pages
pages:
  stage: pages
  script:
    - mkdir public
    - cp -r allure-report/* public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main